# Локальный production-like стенд:
#   - 3 брокера Kafka (KRaft, combined broker+controller), RF=3, min.insync.replicas=2
#   - Schema Registry
#   - Kafka UI
#   - Apache NiFi (интеграция с Kafka, задание 2)

x-kafka-env: &kafka-env
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:29093,2@kafka2:29093,3@kafka3:29093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
  KAFKA_LOG_DIRS: /var/lib/kafka/data

  # --- Репликация и надёжность ---
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

  # --- Политика хранения на уровне брокера (значения по умолчанию для всех топиков) ---
  KAFKA_LOG_CLEANUP_POLICY: delete
  KAFKA_LOG_RETENTION_MS: 604800000          # 7 дней
  KAFKA_LOG_SEGMENT_BYTES: 1073741824        # 1 ГиБ
  KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000

  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_HEAP_OPTS: "-Xms1g -Xmx1g"

x-kafka-broker: &kafka-broker
  image: confluentinc/cp-kafka:7.6.1
  restart: unless-stopped
  cpus: 1.0
  mem_limit: 1536m
  healthcheck:
    test: ["CMD-SHELL", "kafka-topics --bootstrap-server $$(hostname):29092 --list >/dev/null 2>&1"]
    interval: 10s
    timeout: 20s
    retries: 15
    start_period: 20s

services:

  kafka1:
    <<: *kafka-broker
    container_name: kafka1
    hostname: kafka1
    ports:
      - "9092:9092"
    volumes:
      - kafka1-data:/var/lib/kafka/data
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://kafka1:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka1:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:29092,PLAINTEXT_HOST://localhost:9092

  kafka2:
    <<: *kafka-broker
    container_name: kafka2
    hostname: kafka2
    ports:
      - "9094:9092"
    volumes:
      - kafka2-data:/var/lib/kafka/data
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: PLAINTEXT://kafka2:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka2:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:29092,PLAINTEXT_HOST://localhost:9094

  kafka3:
    <<: *kafka-broker
    container_name: kafka3
    hostname: kafka3
    ports:
      - "9095:9092"
    volumes:
      - kafka3-data:/var/lib/kafka/data
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: PLAINTEXT://kafka3:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka3:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:29092,PLAINTEXT_HOST://localhost:9095

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: schema-registry
    hostname: schema-registry
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka1:29092,PLAINTEXT://kafka2:29092,PLAINTEXT://kafka3:29092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC: _schemas
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 3
      SCHEMA_REGISTRY_HEAP_OPTS: "-Xms256m -Xmx384m"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    depends_on:
      - schema-registry
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:29092,kafka2:29092,kafka3:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081

  nifi:
    image: apache/nifi:1.25.0
    container_name: nifi
    hostname: nifi
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 2g
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
      schema-registry:
        condition: service_started
    ports:
      - "8443:8443"
    environment:
      NIFI_WEB_HTTPS_PORT: 8443
      NIFI_WEB_PROXY_HOST: localhost:8443
      # Учётные данные берутся из .env (см. .env.example), пароль — минимум 12 символов
      SINGLE_USER_CREDENTIALS_USERNAME: ${NIFI_USERNAME:?set NIFI_USERNAME in .env}
      SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_PASSWORD:?set NIFI_PASSWORD in .env}
      NIFI_JVM_HEAP_INIT: 512m
      NIFI_JVM_HEAP_MAX: 1g
    volumes:
      - ./nifi/output:/opt/nifi/output

volumes:
  kafka1-data:
  kafka2-data:
  kafka3-data:
